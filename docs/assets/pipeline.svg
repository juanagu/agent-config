    <circle cx="986" cy="294" r="13" fill="#5eead4" fill-opacity="0.16" stroke="#5eead4" stroke-opacity="0.6"/>
    <text x="986" y="299" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#5eead4">7</text>
    <text x="1008" y="300" class="mono" font-size="17" font-weight="600" fill="#f1f5f9">devops-engineer</text>
    <text x="978" y="332" class="sans" font-size="15" fill="#aab6c8">when Docker, CI/CD or</text>
