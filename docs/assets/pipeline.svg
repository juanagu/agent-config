<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="584" viewBox="0 0 1280 584" role="img" aria-labelledby="t d">
  <title id="t">The feature pipeline</title>
  <desc id="d">1. architect-engineer (when it applies): when the change spans layers or introduces a pattern. 2. designer (when it applies): when it touches more than one route, the chrome or a primitive. you approve (when it applies): the artboard for a new screen, before it is built. 3. the engineers: backend and client, with the API contract written first. 4. qa-engineer: verifies it works: two viewports, every locale, screenshots. 5. security-engineer (when it applies): auth, payments, external input, data exposure. 6. technical-writer (when it applies): when user- or developer-facing docs change. 7. devops-engineer (when it applies): when Docker, CI/CD or Cloudflare config changes. 8. review pass: correctness, security and architecture, at a stated level. merge: yours, or the agent's once granted, after review, CI and a re-run. 9. retro (when it applies): when something slipped: files the fix to the setup as an issue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#121c33"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .wire { stroke: #64748b; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1280" height="584" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="583" rx="19.5" fill="none" stroke="#24304a"/>
  <text x="60" y="56" class="sans" font-size="14" font-weight="600" letter-spacing="1.6" fill="#8b98ad">THE FEATURE PIPELINE</text>
  <text x="1220" y="56" text-anchor="end" class="sans" font-size="15" fill="#8b98ad">a small, single-file change skips it</text>

