    <circle cx="86" cy="126" r="13" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="86" y="131" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#a78bfa">1</text>
    <text x="108" y="132" class="mono" font-size="17" font-weight="600" fill="#f1f5f9">architect-engineer</text>
