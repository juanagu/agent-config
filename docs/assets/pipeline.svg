    <circle cx="686" cy="294" r="13" fill="#5eead4" fill-opacity="0.16" stroke="#5eead4" stroke-opacity="0.6"/>
    <text x="686" y="299" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#5eead4">6</text>
    <text x="708" y="300" class="mono" font-size="17" font-weight="600" fill="#f1f5f9">technical-writer</text>
    <text x="678" y="332" class="sans" font-size="15" fill="#aab6c8">when user- or developer-facing</text>
    <text x="678" y="354" class="sans" font-size="15" fill="#aab6c8">docs change</text>
  </g>
  <g>
