<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">agent-config</title>
  <desc id="d">One source (AGENTS.md, agents, skills, the git guard) installed into Claude Code, Cursor, GitHub Copilot and Antigravity CLI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#121c33"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2740" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="19.5" fill="none" stroke="#24304a"/>

  <!-- Pitch -->
  <g class="sans">
    <rect x="64" y="82" width="500" height="38" rx="19" fill="#0f2a2c" stroke="#1f5c58"/>
    <text x="84" y="107" class="mono" font-size="17" fill="#5eead4">npx -y github:juanagu/agent-config -- --project .</text>
    <text x="62" y="198" font-size="68" font-weight="700" fill="#f1f5f9" letter-spacing="-1.5">agent-config</text>
    <text x="64" y="252" font-size="24" fill="#cbd5e1">Engineering standards, specialist agents,</text>
    <text x="64" y="286" font-size="24" fill="#cbd5e1">skills and a git guard, written once and</text>
    <text x="64" y="320" font-size="24" fill="#cbd5e1">installed into four AI coding tools.</text>
  </g>

  <!-- Wires -->
  <g fill="none" stroke="url(#wire)" stroke-width="2.5" stroke-linecap="round">
    <path d="M884 210 C 920 210, 920 96, 956 96"/>
    <path d="M884 210 C 920 210, 920 176, 956 176"/>
    <path d="M884 210 C 920 210, 920 256, 956 256"/>
    <path d="M884 210 C 920 210, 920 336, 956 336"/>
  </g>
  <circle cx="884" cy="210" r="5" fill="#5eead4"/>

  <!-- Source card -->
  <g>
    <rect x="600" y="92" width="284" height="236" rx="14" fill="#0e1729" stroke="#2b3a5a"/>
    <text x="622" y="126" class="sans" font-size="14" font-weight="600" fill="#8b98ad" letter-spacing="1.6">ONE SOURCE</text>
    <g class="mono" font-size="17" fill="#e2e8f0">
      <rect x="616" y="142" width="252" height="38" rx="8" fill="#16213a"/>
      <text x="632" y="167">AGENTS.md</text>
      <text x="852" y="167" text-anchor="end" class="sans" font-size="15" fill="#8b98ad">standards</text>
      <rect x="616" y="186" width="252" height="38" rx="8" fill="#16213a"/>
      <text x="632" y="211">agents/</text>
      <text x="852" y="211" text-anchor="end" class="sans" font-size="15" fill="#8b98ad">13 specialists</text>
      <rect x="616" y="230" width="252" height="38" rx="8" fill="#16213a"/>
      <text x="632" y="255">.agents/skills/</text>
      <text x="852" y="255" text-anchor="end" class="sans" font-size="15" fill="#8b98ad">11 skills</text>
      <rect x="616" y="274" width="252" height="38" rx="8" fill="#16213a"/>
      <text x="632" y="299">git-guard</text>
      <text x="852" y="299" text-anchor="end" class="sans" font-size="15" fill="#8b98ad">hook</text>
    </g>
  </g>

  <!-- Tools -->
  <g class="sans">
    <rect x="956" y="70" width="276" height="52" rx="12" fill="#101b30" stroke="#2b3a5a"/>
    <text x="976" y="103" font-size="19" font-weight="600" fill="#f1f5f9">Claude Code</text>
    <text x="1214" y="103" text-anchor="end" class="mono" font-size="15" fill="#5eead4">.claude/</text>

    <rect x="956" y="150" width="276" height="52" rx="12" fill="#101b30" stroke="#2b3a5a"/>
    <text x="976" y="183" font-size="19" font-weight="600" fill="#f1f5f9">Cursor</text>
    <text x="1214" y="183" text-anchor="end" class="mono" font-size="15" fill="#5eead4">.cursor/</text>

    <rect x="956" y="230" width="276" height="52" rx="12" fill="#101b30" stroke="#2b3a5a"/>
    <text x="976" y="263" font-size="19" font-weight="600" fill="#f1f5f9">GitHub Copilot</text>
    <text x="1214" y="263" text-anchor="end" class="mono" font-size="15" fill="#a78bfa">.github/</text>

    <rect x="956" y="310" width="276" height="52" rx="12" fill="#101b30" stroke="#2b3a5a"/>
    <text x="976" y="343" font-size="19" font-weight="600" fill="#f1f5f9">Antigravity CLI</text>
    <text x="1214" y="343" text-anchor="end" class="mono" font-size="15" fill="#a78bfa">.agents/</text>
  </g>
</svg>
