name: CI

# The two CI tiers the Workflow section of AGENTS.md (juanagu/agent-config) defines: `checks`
# is the fast tier, `e2e-full` the full one, and `npm-audit` the weekly dependency
# audit. Copy this file into a new repo's .github/workflows/. A service repo has no
# browser suite: delete, together, the RUN_SMOKE env with the smoke steps in
# `checks`, and the `e2e-full` and `report-full-tier` jobs, and give `checks`
# `if: github.event_name != 'schedule'`, so only `npm-audit` runs on the
# `schedule` trigger you keep (a weekly `checks` would report to no one).
# Whoever pushes a tag watches its run.
#
# Two things GitHub does that this file cannot change: a push the `paths`
# filter excludes creates no run at all, so never make `checks` a required
# status check (a doc a test reads must be re-included, `- 'docs/the-file.md'`
# after the negation); and a schedule is disabled after 60 days without a
# commit on main, so after a quiet spell run `gh workflow enable ci.yml`.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**'
      - '!docs/**'
      - 'docs/contracts/**'
      - '!**/feature_readme.md'
      - '!README.md'
      - '!AGENTS.md'
      - '!CLAUDE.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - 'docs/contracts/**'
      - '!**/feature_readme.md'
      - '!README.md'
      - '!AGENTS.md'
      - '!CLAUDE.md'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The token is read-only for the jobs that run third-party code (`npm ci`, the
# build, the browsers); only the report job gets more.
permissions:
  contents: read

# Only a PR run is ever cancelled or replaced. GitHub replaces a pending run in
# a group whatever cancel-in-progress says, so a push to main, a tag and the
# weekly run each get a group of their own (the run id) and none can bump
# another off the queue.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The fast tier's smoke set; the full tier runs those specs with the rest.
  RUN_SMOKE: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  # The fast tier in one job: every job pays its own runner setup and `npm ci`
  # and is billed rounded up to the minute, so split it only for a real reason.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Web apps only: the describes tagged @smoke (sign-in, home, the header
      # at 390, the route guards), `playwright test --grep @smoke`. Keep it
      # under a few minutes. Delete these steps in a service repo.
      # The Chromium download is cached by Playwright version (the installed
      # package, hashed after `npm ci`); the system packages `--with-deps`
      # installs are not, and take about half a minute.
      - uses: actions/cache@v4
        if: env.RUN_SMOKE == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('node_modules/@playwright/test/package.json', 'node_modules/playwright/package.json') }}
      - run: npx playwright install --with-deps chromium
        if: env.RUN_SMOKE == 'true'
      - run: npm run test:e2e:smoke
        if: env.RUN_SMOKE == 'true'

  # The weekly run only, never a PR or a push: production dependencies with a high or
  # critical advisory that has a fix. A job of its own, so a stalled audit endpoint never
  # holds up `checks` and a finding opens its own issue rather than the full tier's. It runs
  # no project code (`npm audit` reads the lockfile; no `npm ci`), so it may write issues.
  # An advisory with no fix, or whose only "fix" is an older major, is a warning, not a
  # failure, or every weekly run would stay red. Each attempt is bounded, and an endpoint
  # that stays down, a repo npm cannot audit (no lockfile: ENOLOCK, ENOAUDIT, EAUDITNOLOCK,
  # reported at once, without retries), a failed checkout or setup, or the step's timeout
  # is a warning too:
  # none of them is a vulnerability. Only the audit step's `fixable` verdict opens the
  # issue and turns the run red.
  npm-audit:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    steps:
      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
      - id: node
        uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '22'
      - name: npm audit (production, high and above)
        id: audit
        if: ${{ steps.checkout.outcome == 'success' && steps.node.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          # Exit 0: nothing to fix (unfixable advisories are printed as warnings); 1: a high or
          # critical advisory with a fix; 2: no report, worth a retry (a timeout, a dropped
          # connection, a 5xx); 3: no report, and a retry would fail the same way (no lockfile,
          # ENOAUDIT, EAUDITNOLOCK), printed as a warning naming the code.
          TRIAGE: |
            const fs = require("fs");
            const TRANSIENT = /^(ETIMEDOUT|ESOCKETTIMEDOUT|ECONNRESET|ECONNREFUSED|ECONNABORTED|EPIPE|EAI_AGAIN|ENOTFOUND|EHOSTUNREACH|ENETUNREACH|E429|E5\d\d)$/;
            let report;
            try { report = JSON.parse(fs.readFileSync("audit.json", "utf8")); } catch { process.exit(2); }
            const code = report?.error?.code;
            if (code && !TRANSIENT.test(code)) {
              console.log(`::warning::npm audit cannot run in this repo (${code}): ${report.error.summary ?? ""}`);
              process.exit(3);
            }
            if (!report || typeof report.vulnerabilities !== "object") process.exit(2);
            let lock = {};
            try { lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8")); } catch {}
            const installed = (name) => lock.packages?.["node_modules/" + name]?.version;
            const older = (a, b) => {
              const [x, y] = [a, b].map((v) => String(v).split(".").map((n) => parseInt(n, 10) || 0));
              for (let i = 0; i < 3; i++) if ((x[i] ?? 0) !== (y[i] ?? 0)) return (x[i] ?? 0) < (y[i] ?? 0);
              return false;
            };
            const fixable = (fix) => fix === true || (Boolean(fix) && typeof fix === "object" && !(installed(fix.name) && older(fix.version, installed(fix.name))));
            let failing = 0;
            for (const v of Object.values(report.vulnerabilities)) {
              if (v.severity !== "high" && v.severity !== "critical") continue;
              if (fixable(v.fixAvailable)) {
                failing++;
                console.log(`${v.severity}\t${v.name}\t${v.range}\tfix available`);
              } else console.log(`::warning::${v.severity} ${v.name} ${v.range}: no fix yet (or only an older major)`);
            }
            process.exit(failing ? 1 : 0);
        run: |
          for attempt in 1 2 3; do
            status=0
            timeout 120 npm audit --omit=dev --audit-level=high --json > audit.json || status=$?
            verdict=0
            node -e "$TRIAGE" || verdict=$?
            if [ "$verdict" -eq 1 ]; then echo "verdict=fixable" >> "$GITHUB_OUTPUT"; exit 1; fi
            if [ "$verdict" -eq 0 ]; then echo "verdict=clean" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$verdict" -eq 3 ]; then echo "verdict=misconfigured" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "npm audit gave no report (exit $status), attempt $attempt: $(head -c 300 audit.json)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          echo "verdict=unreachable" >> "$GITHUB_OUTPUT"
          echo "::warning::npm audit could not reach the registry's audit endpoint after 3 attempts; this is not a vulnerability finding."
      - name: Open the audit issue, or comment on the open one
        if: ${{ steps.audit.outcome == 'failure' && steps.audit.outputs.verdict == 'fixable' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Weekly npm audit: high or critical in production dependencies"
        run: |
          existing=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == $ENV.TITLE)][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing on $(date -u +%Y-%m-%d): $RUN_URL"
          else
            gh issue create --title "$TITLE" \
              --body "The weekly npm audit found a high or critical advisory with a fix in a production dependency: $RUN_URL. Run the dependency-audit skill to triage it, and add this issue to the project board."
          fi
      - name: Fail the run on a fixable finding
        if: ${{ steps.audit.outputs.verdict == 'fixable' }}
        run: exit 1
      - name: Warn when the audit did not finish
        if: ${{ !cancelled() && steps.audit.outcome != 'success' && steps.audit.outputs.verdict != 'fixable' }}
        run: echo "::warning::The weekly npm audit did not finish (checkout, setup-node or its timeout); no finding was recorded."

  e2e-full:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # The Chromium download is cached by Playwright version (the installed
      # package, hashed after `npm ci`); the system packages `--with-deps`
      # installs are not, and take about half a minute.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('node_modules/@playwright/test/package.json', 'node_modules/playwright/package.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # A red weekly or release-tag run has no PR to turn red, so it reports to an
  # issue: one per regression, whichever trigger hit it (a comment on the open
  # one, a new one otherwise). The workflow token has no project scope, so the
  # issue goes on the board by hand. A `cancelled` job result is one killed by
  # its timeout-minutes; a run someone cancels from the Actions tab skips this
  # job (`!cancelled()`).
  report-full-tier:
    needs: [checks, e2e-full]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')) && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PREFIX: "Full CI tier failed on"
      WHERE: ${{ github.event_name == 'schedule' && 'main (weekly run)' || github.ref_name }}
    steps:
      - name: Open the issue, or comment on the open one
        run: |
          # Any open issue with the prefix is the same regression, whether the weekly run or
          # a tag found it first. The match runs in jq from the environment: a tag name is not
          # safe to splice into a jq program, and a phrase search also matches longer titles.
          existing=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title | startswith($ENV.PREFIX + " "))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still red on $(date -u +%Y-%m-%d), $WHERE: $RUN_URL"
          else
            gh issue create --title "$PREFIX $WHERE ($(date -u +%Y-%m-%d))" \
              --body "The full tier failed: $RUN_URL. Add this issue to the project board."
          fi
